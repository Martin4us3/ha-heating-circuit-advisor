name: Bug
description: Something does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please leave out personal details (names, addresses, real room names); "Room 1" or "bathroom" is enough.
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Integration 0.1.0, Home Assistant 2026.11.0
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: The circuit's climate (integration), the thermostats and the valves (switch, level in %, radiator thermostat).
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Settings → Devices & services → Heating Circuit Advisor → ⋮ → Download diagnostics, or the log lines.
      render: json
