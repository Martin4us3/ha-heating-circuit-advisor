name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly: Home Assistant's and HACS's requirements move

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.3
      - run: ruff check custom_components tests

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # pytest-homeassistant-custom-component's Home Assistant needs it
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/heating_circuit_advisor --cov-report=term-missing --cov-fail-under=100

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # The HACS action validates public repositories only
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
